<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub-Divisiones EE — Estadio Español Básquetbol</title>
<script>
(function(){
  var saved = null;
  try { saved = localStorage.getItem('ee-theme'); } catch(e){}
  document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0d0909;
    --navy-2:#1c1013;
    --blue-bg:#0a0808;
    --blue-card:#171113;
    --blue-soft:#261a1d;
    --gold:#c8203c;
    --gold-dark:#8c1329;
    --gold-light:#ff4f6b;
    --text:#eef1f7;
    --text-soft:#a89a9c;
    --border:#332a2c;
    --danger:#d9695a;
    --glass:rgba(23,17,19,.62);
    --glass-2:rgba(20,13,14,.65);
    --glass-light:rgba(255,255,255,.04);
    --body-vignette:#2a1418;
    --body-hatch:rgba(255,255,255,.015);
    --display-font:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
    --card-text:#eef1f7;
    --card-text-soft:#a89a9c;
  }
  html[data-theme="light"]{
    --blue-bg:#f7f2f0;
    --blue-card:#ffffff;
    --blue-soft:#fdecef;
    --text:#241417;
    --text-soft:#6b5559;
    --border:#e7dcda;
    --glass:rgba(255,255,255,.72);
    --glass-2:rgba(255,255,255,.55);
    --glass-light:rgba(0,0,0,.025);
    --body-vignette:#fbdde3;
    --body-hatch:rgba(0,0,0,.02);
  }
  *{box-sizing:border-box;}
  @keyframes fadeInUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @keyframes glowPulse{ 0%,100%{box-shadow:0 0 0 1px rgba(200,32,60,.35), 0 26px 55px rgba(0,0,0,.6), 0 0 24px rgba(200,32,60,.18);} 50%{box-shadow:0 0 0 1px rgba(200,32,60,.55), 0 26px 55px rgba(0,0,0,.6), 0 0 42px rgba(200,32,60,.4);} }
  @keyframes heroGlow{ 0%,100%{opacity:.55; transform:translate(-4%,-6%) scale(1);} 50%{opacity:.85; transform:translate(4%,2%) scale(1.08);} }
  @keyframes shimmerSweep{ 0%{transform:translateX(-120%) rotate(8deg);} 100%{transform:translateX(120%) rotate(8deg);} }
  body{
    margin:0;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      repeating-linear-gradient(135deg, var(--body-hatch) 0 2px, transparent 2px 26px),
      radial-gradient(1200px 650px at 50% -12%, var(--body-vignette) 0%, var(--blue-bg) 55%) fixed, var(--blue-bg);
    color:var(--text);
    transition:background-color .25s ease, color .25s ease;
  }
  header{
    background:linear-gradient(135deg,rgba(13,9,9,.72) 0%,rgba(28,16,19,.72) 100%);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    color:#fff;
    padding:0 24px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 2px 20px rgba(0,0,0,.45);
    border-bottom:1px solid rgba(200,32,60,.35);
  }
  .header-inner{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:68px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    color:inherit;
    text-decoration:none;
  }
  .brand:hover .brand-text .name{text-decoration:underline;}
  .brand-badge{
    width:40px;height:40px;border-radius:50%;
    background:linear-gradient(145deg,#f4d7d2,var(--gold-dark));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#1a1206;font-size:16px;
    border:2px solid rgba(255,255,255,.25);
    box-shadow:0 0 14px rgba(200,32,60,.45);
  }
  .brand-text{
    line-height:1.15;
  }
  .brand-text .name{font-family:var(--display-font);font-weight:400;font-size:20px;letter-spacing:.03em;}
  .brand-text .sub{font-size:11.5px;color:var(--gold);letter-spacing:.05em;text-transform:uppercase;}

  nav{position:relative;}
  .nav-btn{
    background:transparent;
    border:1px solid rgba(255,255,255,.35);
    color:#fff;
    padding:9px 16px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
    transition:background .15s;
  }
  .nav-btn:hover{background:var(--gold);border-color:var(--gold);}
  .caret{transition:transform .15s;font-size:11px;}
  .caret.open{transform:rotate(180deg);}

  .sword-btn{
    background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.55);
    width:38px;height:38px;border-radius:8px;font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;margin-left:8px;
    transition:background .15s,border-color .15s,color .15s,transform .15s;
  }
  .sword-btn:hover{background:rgba(200,32,60,.15);border-color:var(--gold);color:#fff;transform:rotate(-12deg);}

  .sword-modal{
    display:none;position:fixed;inset:0;z-index:9998;
    background:rgba(5,3,3,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    align-items:center;justify-content:center;padding:20px;
  }
  .sword-box{
    width:100%;max-width:340px;background:linear-gradient(150deg,#1c1114 0%, #171113 130%);
    border:1px solid #332a2c;border-left:4px solid var(--gold);
    border-radius:4px 16px 16px 4px;padding:24px 26px;
    box-shadow:0 24px 50px rgba(0,0,0,.6);
    animation:fadeInUp .25s ease both;
  }
  .sword-box h3{margin:0 0 4px;font-family:var(--display-font);font-weight:400;font-size:22px;color:#fff;letter-spacing:.02em;}
  .sword-box p.hint{margin:0 0 16px;font-size:12.5px;color:var(--card-text-soft);}
  .sword-box input{
    width:100%;background:#0a0808;border:1px solid #332a2c;border-radius:8px;
    padding:11px 12px;color:var(--card-text);font-size:14px;font-family:inherit;margin-bottom:6px;
  }
  .sword-box input:focus{outline:none;border-color:var(--gold);}
  .sword-error{display:none;color:var(--danger,#d9695a);font-size:12.5px;margin:4px 0 4px;}
  .sword-actions{display:flex;gap:10px;margin-top:14px;justify-content:flex-end;}
  .sword-actions button{
    border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .sword-actions .sw-cancel{background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--card-text-soft);}
  .sword-actions .sw-cancel:hover{border-color:rgba(255,255,255,.5);color:#fff;}
  .sword-actions .sw-enter{background:linear-gradient(145deg,#f4d7d2,var(--gold-dark));border:none;color:#1a1206;}
  .sword-actions .sw-enter:hover{filter:brightness(1.05);}

  #swordFrameWrap{display:none;position:fixed;inset:0;z-index:9999;background:#0a0808;}
  #swordFrameWrap iframe{width:100%;height:100%;border:none;display:block;}
  .sword-close-btn{
    position:absolute;top:14px;right:16px;z-index:10000;
    background:var(--gold);color:#fff;border:none;border-radius:8px;
    padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;
    box-shadow:0 8px 18px rgba(0,0,0,.4);
  }

  .dropdown{
    position:absolute;
    right:0;
    top:calc(100% + 8px);
    background:rgba(23,17,19,.85);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(200,32,60,.3);
    border-radius:10px;
    box-shadow:0 16px 36px rgba(0,0,0,.5);
    min-width:200px;
    overflow:hidden;
    display:none;
  }
  .dropdown.open{display:block;}
  .dropdown button{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:12px 16px;
    font-size:14px;
    font-weight:600;
    color:var(--card-text);
    cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .dropdown button:last-child{border-bottom:none;}
  .dropdown button:hover{background:rgba(200,32,60,.1);color:var(--gold);}
  .dropdown button.staff-link{border-top:2px solid var(--gold);font-weight:800;}

  main{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

  .hero{
    position:relative;
    background:linear-gradient(160deg,var(--glass) 0%, var(--glass-2) 100%);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border);
    border-radius:20px;
    padding:32px 34px;
    margin-bottom:26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    box-shadow:0 20px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;
    animation:fadeInUp .5s ease both;
  }
  .hero::before{
    content:"";position:absolute;top:-30%;left:-10%;width:60%;height:160%;
    background:radial-gradient(circle, rgba(200,32,60,.35) 0%, transparent 65%);
    pointer-events:none;
    animation:heroGlow 9s ease-in-out infinite;
  }
  .hero > *{position:relative;}
  .hero h1{margin:0 0 8px;font-family:var(--display-font);font-weight:400;font-size:38px;letter-spacing:.02em;line-height:1;
    background:linear-gradient(120deg,var(--text) 20%,var(--gold-light) 60%,var(--gold) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{margin:0;color:var(--text-soft);font-size:14.5px;max-width:560px;}
  .hero-note{
    background:rgba(200,32,60,.1);
    color:var(--gold);
    border:1px solid rgba(200,32,60,.35);
    font-size:12.5px;
    font-weight:600;
    padding:8px 14px;
    border-radius:8px;
  }

  .section-title{
    display:flex;align-items:baseline;gap:10px;
    margin:0 0 16px;
  }
  .section-title h2{margin:0;font-family:var(--display-font);font-weight:400;font-size:26px;color:var(--text);letter-spacing:.03em;padding-left:14px;border-left:3px solid var(--gold);}
  .section-title span{font-size:13px;color:var(--text-soft);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:18px;
  }
  .grid > *:nth-child(1){animation-delay:.02s;}
  .grid > *:nth-child(2){animation-delay:.06s;}
  .grid > *:nth-child(3){animation-delay:.10s;}
  .grid > *:nth-child(4){animation-delay:.14s;}
  .grid > *:nth-child(5){animation-delay:.18s;}
  .grid > *:nth-child(6){animation-delay:.22s;}
  .grid > *:nth-child(n+7){animation-delay:.26s;}

  .sub-card{
    background:linear-gradient(150deg,var(--glass) 0%, var(--glass-2) 130%);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border);
    border-left:4px solid var(--gold);
    border-radius:4px 16px 16px 4px;
    padding:20px;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    animation:fadeInUp .5s ease both;
  }
  .sub-card:hover{transform:translateY(-5px) scale(1.015);box-shadow:0 16px 34px rgba(200,32,60,.22);border-color:rgba(200,32,60,.55);}
  .sub-card .tag{
    display:inline-block;
    font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:#fff;
    background:var(--gold);
    border:1px solid rgba(200,32,60,.6);
    padding:3px 10px;
    border-radius:3px;
    margin-bottom:10px;
  }
  .sub-card h3{margin:0 0 6px;font-family:var(--display-font);font-weight:400;font-size:28px;color:var(--text);letter-spacing:.02em;}
  .sub-card p{margin:0;font-size:13px;color:var(--text-soft);}
  .sub-card.staff-card{background:linear-gradient(150deg,#1c1114 0%, var(--blue-card) 130%);border-left-color:#f0e4dc;}
  .sub-card.staff-card .tag{background:#f4ece4;color:#7a0f1e;border-color:#f4ece4;}

  .staff-banner{
    position:relative;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
    background:linear-gradient(120deg, rgba(244,236,228,.07) 0%, var(--glass) 60%);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border);border-left:4px solid #f0e4dc;
    border-radius:4px 16px 16px 4px;
    padding:18px 22px;cursor:pointer;
    animation:fadeInUp .4s ease both;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .staff-banner:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(0,0,0,.35);border-color:rgba(240,228,220,.5);}
  .staff-banner-text .tag{background:#f4ece4;color:#7a0f1e;border-color:#f4ece4;display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:3px;margin-bottom:8px;}
  .staff-banner-text h3{margin:0 0 3px;font-family:var(--display-font);font-weight:400;font-size:22px;color:var(--text);letter-spacing:.01em;}
  .staff-banner-text p{margin:0;font-size:13px;color:var(--text-soft);}
  .staff-banner-right{display:flex;align-items:center;gap:16px;}
  .staff-avatar-stack{display:flex;}
  .staff-avatar{
    width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:#fff;
    border:2px solid var(--blue-card);margin-left:-12px;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .staff-avatar:first-child{margin-left:0;}
  .staff-avatar img{width:100%;height:100%;object-fit:cover;object-position:center top;}
  .staff-avatar.more{background:var(--gold-dark);font-size:11px;}
  .staff-banner-arrow{font-size:13px;font-weight:700;color:#f0e4dc;white-space:nowrap;}

  .back-btn{
    background:none;border:none;color:var(--gold);font-weight:700;
    font-size:13.5px;cursor:pointer;margin-bottom:18px;padding:0;
    display:flex;align-items:center;gap:6px;
  }
  .back-btn:hover{text-decoration:underline;}

  .coach-card{
    background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border);border-left:4px solid var(--gold);
    border-radius:4px 16px 16px 4px;
    padding:20px 22px;margin-bottom:22px;
    display:flex;align-items:center;gap:16px;
    animation:fadeInUp .5s ease both;
  }
  .avatar{
    width:56px;height:56px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:17px;color:#fff;
    flex-shrink:0;
  }
  .coach-card .info .role{font-size:11.5px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;}
  .coach-card .info .name{font-size:17px;font-weight:700;color:var(--text);margin-top:2px;}

  .player-card{
    background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border);border-radius:4px 16px 16px 4px;
    overflow:hidden;cursor:pointer;position:relative;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    animation:fadeInUp .5s ease both;
  }
  .player-card:hover{transform:translateY(-5px) scale(1.015);box-shadow:0 16px 34px rgba(200,32,60,.22);border-color:rgba(200,32,60,.55);}
  .player-photo{
    aspect-ratio:4/5;
    display:flex;align-items:center;justify-content:center;
    font-size:40px;font-weight:800;color:#fff;
    position:relative;
    overflow:hidden;
    background-size:cover;background-position:center top;
  }
  .player-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
  .player-photo .number{
    position:absolute;bottom:-3px;right:12px;
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:#fff;
    background:var(--gold);border:2px solid var(--blue-card);
    box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .player-card .pc-body{padding:16px 16px 14px;}
  .player-card .pc-name{font-weight:800;font-size:14.5px;color:var(--text);margin:0 0 4px;}
  .player-card .pc-pos{font-size:11.5px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.03em;margin:0;}

  .card-stage{display:flex;justify-content:center;margin:8px 0 36px;}
  .fifa-card{
    position:relative;
    width:300px;
    padding:24px 22px 20px;
    border-radius:22px 22px 54px 54px/22px 22px 80px 80px;
    background:linear-gradient(160deg,#231519 0%, #130b0d 60%, #0a0708 100%);
    border:2px solid var(--gold);
    box-shadow:0 0 0 1px rgba(200,32,60,.25), 0 26px 55px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    overflow:hidden;
    animation:fadeInUp .5s ease both, glowPulse 4.5s ease-in-out infinite;
    transition:transform .25s ease;
  }
  .fifa-card:hover{transform:translateY(-4px);}
  .fifa-card::before{
    content:"";
    position:absolute;inset:0;
    background:
      linear-gradient(115deg, transparent 32%, rgba(255,255,255,.07) 46%, transparent 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 2px, transparent 2px 22px);
    pointer-events:none;
  }
  .fifa-card::after{
    content:"";
    position:absolute;top:-60%;left:-60%;width:35%;height:220%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,.4), transparent);
    transform:translateX(-120%) rotate(8deg);
    pointer-events:none;opacity:0;
  }
  .fifa-card:hover::after{opacity:1;animation:shimmerSweep 1s ease;}
  .fifa-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;}
  .fifa-rating{font-family:var(--display-font);font-weight:400;font-size:56px;color:var(--gold);line-height:1;text-shadow:0 0 22px rgba(200,32,60,.6);}
  .fifa-pos{font-size:13.5px;font-weight:700;color:var(--card-text);letter-spacing:.08em;margin-top:5px;}
  .fifa-club{
    width:32px;height:32px;border-radius:50%;
    background:linear-gradient(145deg,#f4d7d2,var(--gold-dark));
    display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:800;color:#1a1206;
    box-shadow:0 0 12px rgba(200,32,60,.4);
  }
  .fifa-photo-wrap{display:flex;justify-content:center;margin:2px 0 10px;position:relative;}
  .fifa-photo{
    width:190px;height:240px;border-radius:18px 18px 26px 26px;
    display:flex;align-items:center;justify-content:center;
    font-size:50px;font-weight:800;color:#fff;
    border:3px solid rgba(200,32,60,.55);
    box-shadow:0 14px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(200,32,60,.15);
    overflow:hidden;
    background-size:cover;background-position:center;
  }
  .fifa-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
  .fifa-name{
    text-align:center;font-size:17.5px;font-weight:800;color:#fff;
    letter-spacing:.03em;text-transform:uppercase;margin:14px 8px 4px;
    background:linear-gradient(120deg,var(--gold-dark),var(--gold) 60%);
    clip-path:polygon(2% 0,98% 0,100% 50%,98% 100%,2% 100%,0 50%);
    padding:9px 14px;position:relative;
    box-shadow:0 6px 14px rgba(0,0,0,.35);
  }
  .fifa-sub{text-align:center;font-size:11px;color:var(--gold);letter-spacing:.1em;margin:10px 0 16px;position:relative;font-weight:700;}
  .fifa-stats{
    display:grid;grid-template-columns:repeat(2,1fr);gap:14px 8px;
    padding:0 10px;position:relative;
  }
  .fifa-stat{text-align:center;border-top:1px solid rgba(255,255,255,.08);padding-top:8px;}
  .fifa-stat.wide{grid-column:1 / -1;}
  .fifa-stat .num{font-size:21px;font-weight:800;color:var(--card-text);}
  .fifa-stat .lbl{font-size:10px;color:var(--gold);letter-spacing:.09em;margin-top:2px;font-weight:700;}
  .fifa-coach{
    margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);
    text-align:center;font-size:11.5px;color:var(--card-text-soft);position:relative;
  }
  .fifa-coach b{color:var(--gold);}

  .badge-row{
    display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
    margin:0 18px 14px;position:relative;
  }
  .badge-pill{
    background:rgba(200,32,60,.14);border:1px solid rgba(200,32,60,.5);color:var(--gold);
    font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
    padding:4px 10px;border-radius:999px;
  }

  .season-title{
    text-align:center;font-size:10.5px;font-weight:800;color:var(--card-text-soft);
    letter-spacing:.12em;text-transform:uppercase;margin:18px 0 10px;position:relative;
  }
  .season-stats{
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px 4px;
    padding:0 10px 4px;position:relative;
  }
  .season-stats .fifa-stat{border-top:none;padding-top:0;}
  .season-stats .fifa-stat .num{font-size:17px;}
  .season-stats .fifa-stat .lbl{font-size:8.5px;}

  .next-match-card{
    background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-left:4px solid var(--gold);
    border-radius:4px 16px 16px 4px;padding:16px 20px;margin-bottom:22px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    animation:fadeInUp .5s ease both;
  }
  .next-match-card .nm-label{font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
  .next-match-card .nm-main{font-size:16px;font-weight:800;color:var(--text);}
  .next-match-card .nm-sub{font-size:12.5px;color:var(--text-soft);margin-top:2px;}
  .next-match-card .maps-link{
    color:#fff;background:linear-gradient(135deg,var(--gold-light),var(--gold-dark));border-radius:8px;padding:9px 16px;
    font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;
    box-shadow:0 6px 16px rgba(200,32,60,.3);transition:filter .15s,transform .15s;
  }
  .next-match-card .maps-link:hover{filter:brightness(1.12);transform:translateY(-2px);}

  .compare-link{
    background:rgba(200,32,60,.08);border:1px solid rgba(200,32,60,.45);color:var(--gold);
    font-size:13px;font-weight:700;padding:9px 16px;border-radius:8px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    transition:background .15s,transform .15s;
  }
  .compare-link:hover{background:rgba(200,32,60,.16);transform:translateY(-2px);}
  .compare-picker{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:26px;
  }
  .compare-picker select{
    background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;color:var(--text);font-size:14px;min-width:220px;
  }
  .compare-vs{font-weight:800;color:var(--gold);font-size:15px;}
  .compare-table{width:100%;border-collapse:collapse;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;overflow:hidden;animation:fadeInUp .4s ease both;}
  .compare-table th, .compare-table td{padding:12px 16px;text-align:center;font-size:13.5px;border-bottom:1px solid var(--border);}
  .compare-table tr:last-child td{border-bottom:none;}
  .compare-table th{background:rgba(200,32,60,.1);color:var(--gold);font-size:11px;letter-spacing:.04em;text-transform:uppercase;}
  .compare-table td:first-child{color:var(--text-soft);text-align:left;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .compare-table td.win{color:var(--gold);font-weight:800;}
  .compare-head{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:18px;}
  .compare-head .cph{text-align:center;}
  .compare-head .cph .avatar{width:64px;height:64px;margin:0 auto 8px;font-size:20px;overflow:hidden;}
  .compare-head .cph .cn{font-weight:800;font-size:14.5px;color:var(--text);}

  .gallery-title{margin:30px 0 14px;font-size:16px;color:var(--text);padding-left:12px;border-left:3px solid var(--gold);}
  .gallery-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:14px;
  }
  .gallery-item{
    aspect-ratio:4/3;
    border:2px dashed var(--border);
    border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;
    color:var(--text-soft);
    background:rgba(255,255,255,.015);
    font-size:12.5px;
    text-align:center;
    padding:10px;
  }
  .gallery-item svg{opacity:.5;}

  footer{
    text-align:center;padding:26px;color:var(--text-soft);font-size:12.5px;
    border-top:1px solid var(--border);
  }

  .example-banner{
    background:rgba(200,32,60,.08);border:1px solid rgba(200,32,60,.3);color:var(--gold);
    font-size:12.5px;padding:10px 16px;border-radius:10px;margin-bottom:22px;
    display:flex;align-items:center;gap:8px;
  }
</style>
</head>

function colorFor(str){
  let h = 0;
  for (let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function initials(name){
  return name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
}

let state = { view:"home", subId:null, playerId:null };

function toggleDropdown(){
  const dd = document.getElementById("dropdown");
  const caret = document.getElementById("caret");
  const open = dd.classList.toggle("open");
  caret.classList.toggle("open", open);
}
document.addEventListener("click", (e)=>{
  const dd = document.getElementById("dropdown");
  const btn = document.getElementById("navToggle");
  if (dd.classList.contains("open") && !dd.contains(e.target) && e.target !== btn){
    dd.classList.remove("open");
    document.getElementById("caret").classList.remove("open");
  }
});

function buildDropdown(){
  const dd = document.getElementById("dropdown");
  dd.innerHTML = "";
  DATA.subdivisions.forEach(sd=>{
    const b = document.createElement("button");
    b.textContent = sd.label;
    b.onclick = (e)=>{ e.stopPropagation(); showSubdivision(sd.id); dd.classList.remove("open"); document.getElementById("caret").classList.remove("open"); };
    dd.appendChild(b);
  });
  const staffBtn = document.createElement("button");
  staffBtn.textContent = "Entrenadores";
  staffBtn.className = "staff-link";
  staffBtn.onclick = (e)=>{ e.stopPropagation(); showCoaches(); dd.classList.remove("open"); document.getElementById("caret").classList.remove("open"); };
  dd.appendChild(staffBtn);
}

function goHome(){ state = {view:"home", subId:null, playerId:null}; render(); }
function showSubdivision(id){ state = {view:"subdivision", subId:id, playerId:null}; render(); }
function showPlayer(subId, playerId){ state = {view:"player", subId, playerId}; render(); }
function showCoaches(){ state = {view:"coaches", subId:null, playerId:null}; render(); }
function showCoachProfile(subId){ state = {view:"coachProfile", subId, playerId:null}; render(); }
function showCompare(subId){ state = {view:"compare", subId, playerId:null, compareA:null, compareB:null}; render(); }
function setCompareA(id){ state.compareA = id || null; render(); }
function setCompareB(id){ state.compareB = id || null; render(); }

function render(){
  const main = document.getElementById("main");
  if (state.view === "home") main.innerHTML = renderHome();
  else if (state.view === "subdivision") main.innerHTML = renderSubdivision(state.subId);
  else if (state.view === "player") main.innerHTML = renderPlayer(state.subId, state.playerId);
  else if (state.view === "coaches") main.innerHTML = renderCoaches();
  else if (state.view === "coachProfile") main.innerHTML = renderCoachProfile(state.subId);
  else if (state.view === "compare") main.innerHTML = renderCompare(state.subId);
  window.scrollTo({top:0, behavior:"instant"});
}

function renderHome(){
  const cards = DATA.subdivisions.map(sd=>`
    <div class="sub-card" onclick="showSubdivision('${sd.id}')">
      <span class="tag">CATEGORÍA</span>
      <h3>${sd.label}</h3>
      <p>${sd.players.length} jugadores · Entrenador: ${sd.coach.name}</p>
    </div>
  `).join("");

  const maxAvatars = 5;
  const shown = DATA.subdivisions.slice(0, maxAvatars);
  const extra = DATA.subdivisions.length - shown.length;
  const avatars = shown.map(sd=>{
    const c = colorFor(sd.coach.name);
    const photoInner = sd.coach.photo ? `<img src="${sd.coach.photo}" alt="${sd.coach.name}">` : initials(sd.coach.name);
    const photoStyle = sd.coach.photo ? "" : `background:${c}`;
    return `<div class="staff-avatar" style="${photoStyle}" title="${sd.coach.name}">${photoInner}</div>`;
  }).join("") + (extra > 0 ? `<div class="staff-avatar more">+${extra}</div>` : "");

  return `
    <div class="hero">
      <div>
        <h1>${DATA.clubName}</h1>
        <p>Directorio de jugadores por categoría: datos, entrenadores y fotos de partidos. Usa el menú "Categorías" arriba o elige una categoría abajo.</p>
      </div>
      <div class="hero-note">📋 Datos de ejemplo</div>
    </div>
    <div class="staff-banner" onclick="showCoaches()">
      <div class="staff-banner-text">
        <span class="tag">CUERPO TÉCNICO</span>
        <h3>Entrenadores</h3>
        <p>${DATA.subdivisions.length} categorías con entrenador/a asignado/a</p>
      </div>
      <div class="staff-banner-right">
        <div class="staff-avatar-stack">${avatars}</div>
        <span class="staff-banner-arrow">Ver todos →</span>
      </div>
    </div>
    <div class="section-title" style="margin-top:30px;"><h2>Categorías</h2><span>Selecciona una para ver el plantel</span></div>
    <div class="grid">${cards}</div>
  `;
}

function renderCoaches(){
  const tiles = DATA.subdivisions.map(sd=>{
    const c = colorFor(sd.coach.name);
    const photoInner = sd.coach.photo ? `<img src="${sd.coach.photo}" alt="${sd.coach.name}">` : initials(sd.coach.name);
    const photoStyle = sd.coach.photo ? "" : `background:${c}`;
    return `
      <div class="player-card" onclick="showCoachProfile('${sd.id}')">
        <div class="player-photo" style="${photoStyle}">${photoInner}</div>
        <div class="pc-body">
          <p class="pc-name">${sd.coach.name}</p>
          <p class="pc-pos">${sd.coach.role || ("Entrenador/a " + sd.label)}</p>
        </div>
      </div>
    `;
  }).join("");

  return `
    <button class="back-btn" onclick="goHome()">← Volver al inicio</button>
    <div class="section-title"><h2>Entrenadores</h2><span>${DATA.subdivisions.length} categorías con entrenador/a</span></div>
    <div class="grid">${tiles}</div>
  `;
}

function renderCoachProfile(subId){
  const sd = DATA.subdivisions.find(s=>s.id===subId);
  const coach = sd.coach;
  const c = colorFor(coach.name);
  const photoInner = coach.photo ? `<img src="${coach.photo}" alt="${coach.name}">` : initials(coach.name);
  const photoStyle = coach.photo ? "" : `background:${c}`;

  return `
    <button class="back-btn" onclick="showCoaches()">← Volver a entrenadores</button>
    <div class="card-stage">
      <div class="fifa-card">
        <div class="fifa-top">
          <div class="fifa-pos">ENTRENADOR/A</div>

function calcAge(birthStr){
  if (!birthStr) return "—";
  const parts = birthStr.split("/");
  if (parts.length !== 3) return "—";
  const [d,m,y] = parts.map(Number);
  const birth = new Date(y, m-1, d);
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  const hadBirthday = (today.getMonth() > birth.getMonth()) ||
    (today.getMonth() === birth.getMonth() && today.getDate() >= birth.getDate());
  if (!hadBirthday) age--;
  return age;
}

function renderCompareResult(a,b){
  const c1 = colorFor(a.name), c2 = colorFor(b.name);
  const photo1 = a.photo ? `<img src="${a.photo}" alt="${a.name}" style="width:100%;height:100%;object-fit:cover;">` : initials(a.name);
  const photo2 = b.photo ? `<img src="${b.photo}" alt="${b.name}" style="width:100%;height:100%;object-fit:cover;">` : initials(b.name);

  const statRows = [
    ["Altura", a.height, b.height, false],
    ["Peso", a.weight, b.weight, false],
    ["Edad", calcAge(a.birth), calcAge(b.birth), false],
    ["Puntos/partido", a.stats ? a.stats.points : null, b.stats ? b.stats.points : null, true],
    ["Tiros libres/partido", a.stats ? a.stats.ft : null, b.stats ? b.stats.ft : null, true],
    ["Dobles/partido", a.stats ? a.stats.twopt : null, b.stats ? b.stats.twopt : null, true],
    ["Triples/partido", a.stats ? a.stats.threept : null, b.stats ? b.stats.threept : null, true],
    ["Faltas/partido", a.stats ? a.stats.fouls : null, b.stats ? b.stats.fouls : null, false],
  ];

  const rowsHtml = statRows.map(row=>{
    const label = row[0], va = row[1], vb = row[2], higherIsBetter = row[3];
    const va2 = va != null ? va : "—";
    const vb2 = vb != null ? vb : "—";
    let winA = false, winB = false;
    if (higherIsBetter && typeof va === "number" && typeof vb === "number" && va !== vb){
      winA = va > vb; winB = vb > va;
    }
    return `<tr><td>${label}</td><td class="${winA?'win':''}">${va2}</td><td class="${winB?'win':''}">${vb2}</td></tr>`;
  }).join("");

  return `
    <div class="compare-head">
      <div class="cph"><div class="avatar" style="background:${c1};">${photo1}</div><div class="cn">${a.name}</div></div>
      <div class="compare-vs">VS</div>
      <div class="cph"><div class="avatar" style="background:${c2};">${photo2}</div><div class="cn">${b.name}</div></div>
    </div>
    <table class="compare-table">
      <tr><th>Estadística</th><th>${a.name}</th><th>${b.name}</th></tr>
      ${rowsHtml}
    </table>
  `;
}

}
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function b64ToUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
async function submitSwordGate(){
  const pass = document.getElementById("swordPass").value;
  const hash = await sha256Hex(pass);
  if (hash === SWORD_GATE_HASH){
    closeSwordGate();
    openSwordPanel();
  } else {
    document.getElementById("swordError").style.display = "block";
  }
}
document.getElementById("swordPass").addEventListener("keydown", (e)=>{
  if (e.key === "Enter") submitSwordGate();
  if (e.key === "Escape") closeSwordGate();
});
function openSwordPanel(){
  if (!SWORD_PANEL_B64){
    alert("El panel de administración no está disponible en esta copia del sitio.");
    return;
  }
  const html = b64ToUtf8(SWORD_PANEL_B64);
  document.getElementById("swordFrame").srcdoc = html;
  document.getElementById("swordFrameWrap").style.display = "block";
}
function closeSwordFrame(){
  document.getElementById("swordFrameWrap").style.display = "none";
  document.getElementById("swordFrame").srcdoc = "";
}
